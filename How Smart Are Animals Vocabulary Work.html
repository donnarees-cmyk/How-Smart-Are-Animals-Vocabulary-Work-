<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Smart Are Animals? Vocabulary</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16365c; --gold:#e3a91c; --gold-soft:#fdf3d7; --teal:#138a8a; --purple:#7a3f98;
  --pink:#e0526e; --green:#3f8a3f; --cream:#fffaf0; --ink:#1d2433; --muted:#5d6678;
  --line:#e6dcc4; --ok:#2f8a46; --ok-bg:#e5f5e9; --bad:#c23b3b; --bad-bg:#fdeaea;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:14px;padding:6px 0 10px}
header.top img{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header.top h1{font-family:Fredoka,sans-serif;color:var(--navy);font-size:clamp(22px,4.5vw,32px);margin:0;line-height:1.15}
header.top .sub{color:var(--muted);font-weight:700;font-size:15px}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 3px 0 var(--line)}
.btn{border:none;border-radius:14px;padding:12px 20px;font-weight:800;background:var(--navy);color:#fff;box-shadow:0 4px 0 #0b1f38;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1f38}
.btn.gold{background:var(--gold);color:var(--navy);box-shadow:0 4px 0 #a97a0c}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.speak{border:2px solid var(--teal);background:#fff;color:var(--teal);border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px}
/* key ring */
.ring{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.keybtn{position:relative;width:64px;height:64px;border-radius:16px;border:3px solid var(--line);background:#fff;font-family:Fredoka;font-size:22px;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.keybtn small{font-size:11px;font-family:Nunito;font-weight:800;color:var(--muted);margin-top:3px}
.keybtn.done{background:var(--gold-soft);border-color:var(--gold)}
.keybtn.current{outline:4px solid var(--teal);outline-offset:2px}
.keybtn.locked{opacity:.45}
.ringlabel{font-weight:800;color:var(--navy);font-size:15px;width:100%}
.today{display:inline-block;background:var(--teal);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;margin-left:6px}
/* word card */
.wordhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.num{font-family:Fredoka;color:#fff;background:var(--purple);border-radius:12px;padding:4px 12px;font-size:18px}
.theword{font-family:Fredoka;font-size:clamp(30px,7vw,44px);color:var(--navy);margin:8px 0 2px}
.context{background:var(--gold-soft);border-left:6px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:19px}
.context mark{background:#ffe066;padding:0 3px;border-radius:4px;font-weight:800}
.step{margin-top:20px;border-top:2px dashed var(--line);padding-top:16px}
.step h3{font-family:Fredoka;color:var(--navy);margin:0 0 4px;font-size:21px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step .hint{color:var(--muted);font-size:16px;margin:0 0 10px}
.choices{display:grid;gap:10px}
.choices.pos{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.choice{text-align:left;border:3px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-weight:700;color:var(--ink)}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through;opacity:.75}
.choices.pics{grid-template-columns:repeat(4,1fr)}
.choice.pic{text-align:center;font-size:44px;padding:10px 4px;line-height:1.2}
.choice.pic span{display:block;font-size:13px;font-weight:800;color:var(--muted)}
.feedback{margin-top:8px;font-weight:800;min-height:1.4em}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)}
.lockedstep{opacity:.35;pointer-events:none}
textarea{width:100%;min-height:110px;font:inherit;font-size:20px;border:3px solid var(--line);border-radius:14px;padding:12px;resize:vertical;background:#fffdf7}
textarea:focus{outline:none;border-color:var(--teal)}
textarea[readonly]{background:#f3f7f3;border-color:var(--ok)}
.checks{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:16px;color:var(--muted)}
.checks li .ic{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid #c9cfd9;display:flex;align-items:center;justify-content:center;font-size:14px}
.checks li.pass{color:var(--ok)} .checks li.pass .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.nudge{background:#fff4e0;border:2px solid #f0c27a;border-radius:12px;padding:10px 12px;font-weight:700;font-size:16px;margin:8px 0;display:none}
.nudge.show{display:block}
.warn{background:var(--bad-bg);border:2px solid var(--bad);color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:800;font-size:16px;margin:8px 0;display:none}
.warn.show{display:block}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.starter{border:2px dashed var(--purple);background:#faf5fd;color:var(--purple);border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.earned{background:var(--gold-soft);border:3px solid var(--gold);border-radius:16px;padding:14px;text-align:center;font-family:Fredoka;color:var(--navy);font-size:22px}
.pill{display:inline-block;background:#eef2f8;color:var(--navy);border-radius:999px;padding:2px 10px;font-weight:800;font-size:14px}
/* name screen */
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.namegrid input{width:100%;font:inherit;font-size:20px;border:3px solid var(--line);border-radius:12px;padding:10px}
.howto{padding-left:0;list-style:none;display:grid;gap:8px}
.howto li{background:#f6f8fc;border-radius:12px;padding:8px 12px;font-weight:700}
/* turn-in */
#turnin{position:relative}
.watermark{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.watermark div{position:absolute;white-space:nowrap;font-family:Fredoka;font-size:28px;color:rgba(22,54,92,.06);transform:rotate(-24deg)}
#turnin > *{position:relative;z-index:1}
table.ti{width:100%;border-collapse:collapse;font-size:15px;background:transparent}
table.ti th,table.ti td{border:1.5px solid #9aa6b8;padding:8px;vertical-align:top;text-align:left}
table.ti th{background:#eef2f8;color:var(--navy)}
table.ti td.pic{font-size:34px;text-align:center}
.score{font-family:Fredoka;font-size:28px;color:var(--navy)}
.workbanner{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:16px;padding:10px 14px;margin-bottom:12px}
.workbanner img{width:58px;height:58px;border-radius:50%;background:#fff}
.wbtitle{font-family:Fredoka;font-size:28px;color:var(--gold)}
.gradebox{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.gradebox .g{border:3px solid var(--line);border-radius:14px;padding:10px;text-align:center;background:rgba(255,255,255,.85)}
.gradebox .g.main{border-color:var(--gold);background:var(--gold-soft)}
.gl{font-weight:800;font-size:14px;color:var(--muted)}
.gn{font-family:Fredoka;font-size:30px;color:var(--navy);line-height:1.1}
.gp{font-weight:800;color:var(--teal)}
.tries{white-space:nowrap;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3}
@media print{.workbanner,.gradebox .g{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.teacher{font-size:13px;color:var(--muted);text-align:center;margin:30px 0 10px}
.teacher button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:13px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.hide{display:none!important}
@media (max-width:560px){.namegrid{grid-template-columns:1fr}.choices.pics{grid-template-columns:repeat(2,1fr)} table.ti{font-size:13px}}
@media print{
  body{background:#fff;font-size:13px}
  .noprint,#app>*:not(#turnin),header.top .speak,#confetti,.teacher{display:none!important}
  #turnin{display:block!important;border:none;box-shadow:none;padding:0}
  .watermark div{color:rgba(22,54,92,.09)}
  .wrap{max-width:none;padding:0}
}
</style>
</head>

/* ===================== READ ALOUD (Google US English) ===================== */
let VOICE=null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  VOICE = vs.find(v=>v.name==="Google US English") || vs.find(v=>/Samantha/i.test(v.name)) || vs.find(v=>v.lang==="en-US") || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,""));
  if(VOICE) u.voice = VOICE; u.lang="en-US"; u.rate=.95;
  speechSynthesis.speak(u);
}

function shuffleOnce(arr,seed){ // stable per student so order doesn't change on reload
  const a=arr.map((x,i)=>({x,i})); let h=0; for(const ch of seed) h=(h*31+ch.charCodeAt(0))>>>0;
  for(let i=a.length-1;i>0;i--){ h=(h*1103515245+12345)>>>0; const j=h%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a.map(o=>o.x);
}

/* ===================== SENTENCE CHECKER ===================== */
function tokens(s){ return (s.toLowerCase().match(/[a-z']+/g)||[]); }
function checkSentence(raw, w){
  const s = raw.trim();
  const words = tokens(s);
  const usesWord = words.some(t=>w.forms.includes(t));
  const exTok = new Set(tokens(w.example));
  const overlap = words.length ? words.filter(t=>exTok.has(t)).length / Math.max(words.length, exTok.size) : 0;
  const capStart = /^["“']?[A-Z]/.test(s);
  const endPunct = /[.!?]["”']?$/.test(s);
  const loneI = /(^|[^a-zA-Z'])i([^a-zA-Z']|$)/.test(s) || /(^|\s)i'(m|ll|ve|d)\b/.test(s);
  const capAfterStop = !/[.!?]\s+[a-z]/.test(s);
  const allCaps = s.length>10 && s===s.toUpperCase() && /[A-Z]/.test(s);
  const definingIt = new RegExp("\\b("+w.forms.join("|")+")\\s+(means|is when|is a word)","i").test(s);
  const checks = [
    {id:"cap",   label:"Starts with a capital letter", pass:capStart && !allCaps},
    {id:"end",   label:"Ends with a period . question mark ? or exclamation point !", pass:endPunct},
    {id:"word",  label:`Uses the word "${w.word}"`, pass:usesWord},
    {id:"len",   label:"Has at least 8 words (a complete thought)", pass:words.length>=8},
    {id:"own",   label:"Is your own sentence, not the example", pass:words.length>0 && overlap<0.6},
    {id:"i",     label:"Every \"I\" by itself is a capital I", pass:s.length>0 && !loneI},
    {id:"mid",   label:"A new sentence inside starts with a capital", pass:s.length>0 && capAfterStop}
  ];
  let nudge="";
  if(allCaps) nudge="🔠 Whoa, ALL CAPS! Only the first letter of a sentence (and names) gets a capital.";
  else if(!capStart && s.length>0) nudge="💡 Go back to the very first letter and make it a capital.";
  else if(loneI) nudge="💡 When you write about yourself, \"I\" is always a capital letter, even in the middle of a sentence.";
  else if(definingIt) nudge="💡 Don't tell what the word means. Show it in action, like the word is doing a job in your sentence.";
  else if(s.length>0 && words.length<8 && usesWord) nudge="💡 Add more! Who? What? Where? Why? Tell more of the story.";
  else if(s.length>0 && !endPunct && words.length>=8) nudge="💡 Almost! Every sentence needs an end mark: . ? or !";
  else if(words.length>0 && overlap>=0.6) nudge="💡 That's too close to the example sentence. Make up a brand-new situation.";
  const ok = checks.every(c=>c.pass) && !definingIt;
  return {checks, nudge, ok};
}

/* ===================== RENDER ===================== */
function render(){
  if(!S.first || !S.last){ renderName(); return; }
  if(S.current==="turnin"){ renderTurnIn(); return; }
  renderWord(S.current);
}

function ringHTML(){
  let h = `<div class="card noprint"><div class="ring"><div class="ringlabel">🔑 ${esc(fullName())}'s Key Ring <span class="pill">${doneCount()} / 6 keys</span></div>`;
  WORDS.forEach((w,i)=>{
    const cls = ["keybtn", wordDone(i)?"done":"", S.current===i?"current":"", unlocked(i)?"":"locked"].join(" ");
    h += `<button class="${cls}" data-go="${i}" aria-label="Word ${w.n}">${wordDone(i)?"🔑":(unlocked(i)?w.n:"🔒")}<small>${i<3?"today":"later"}</small></button>`;
  });
  h += `<button class="btn gold" data-go="turnin" style="margin-left:auto">📄 My Work</button></div></div>`;
  return h;
}

function renderName(){
  $("#app").innerHTML = `
  <div class="card">
    <h2 style="font-family:Fredoka;color:var(--navy);margin-top:0">Welcome, Locksmith! 🔐 <button class="speak" id="readIntro">🔊 Read to me</button></h2>
    <ul class="howto">
      <li>1️⃣ Read each word in its sentence.</li>
      <li>2️⃣ Pick the part of speech, the meaning, and a picture.</li>
      <li>3️⃣ Type your OWN sentence. It unlocks when it has a capital, end punctuation, and at least 8 words.</li>
      <li>📅 Do <b>numbers 1–3 today</b>. Numbers 4–6 unlock after that.</li>
      <li>💾 Your work saves on this iPad by itself.</li>
    </ul>
    <p style="font-weight:800;color:var(--navy);margin-bottom:6px">Type your first and last name. Use capital letters!</p>
    <div class="namegrid">
      <input id="fn" placeholder="First name" autocomplete="off" autocapitalize="none" autocorrect="off">
      <input id="ln" placeholder="Last name" autocomplete="off" autocapitalize="none" autocorrect="off">
    </div>
    <div class="feedback no" id="nameMsg"></div>
    <div class="row"><button class="btn" id="startBtn">Start unlocking ➜</button></div>
  </div>`;
  $("#readIntro").onclick=()=>say("Welcome, Locksmith! Read each word in its sentence. Pick the part of speech, the meaning, and a picture. Then type your own sentence. It unlocks when it has a capital letter, end punctuation, and at least eight words. Do numbers one through three today. Your work saves on this iPad by itself. Type your first and last name, and use capital letters!");
  $("#startBtn").onclick=()=>{
    const f=$("#fn").value.trim(), l=$("#ln").value.trim();
    if(f.length<2||l.length<2){ $("#nameMsg").textContent="Please type your whole first AND last name."; return; }
    if(!/^[A-Z]/.test(f)||!/^[A-Z]/.test(l)){ $("#nameMsg").textContent="🔠 Names are proper nouns. Start each one with a capital letter!"; return; }
    S.first=f; S.last=l; S.started=Date.now(); S.current=0; save(); render();
  };
}

function renderWord(i){
  const w=WORDS[i], it=S.items[i];
  if(!unlocked(i)){ S.current=0; return render(); }
  const seed=fullName()+w.word;
  const defs=shuffleOnce(w.defs,seed+"d"), pics=w.pics;
  let h = ringHTML();
  h += `<div class="card">
    <div class="wordhead"><span class="num">Word ${w.n} of 6</span><button class="speak" id="sayCtx">🔊 Read the sentence</button></div>
    <div class="theword">${w.word}</div>
    <div class="context">${w.context}</div>

    <div class="step" id="st1">
      <h3>Step 1 · Part of Speech</h3>
      <p class="hint">How is "${w.word}" used in this sentence? Check the chart: noun = thing, verb = action, adjective = describes a noun, adverb = describes a verb.</p>
      <div class="choices pos">${POS_OPTS.map(p=>`<button class="choice ${it.posDone&&p===w.pos?"right":""}" data-pos="${p}">${p}</button>`).join("")}</div>
      <div class="feedback" id="fb1">${it.posDone?"✅ Yes! It's a "+w.pos+".":""}</div>
    </div>

    <div class="step ${it.posDone?"":"lockedstep"}" id="st2">
      <h3>Step 2 · Denotation (Definition) <button class="speak" id="sayDefs">🔊</button></h3>
      <p class="hint">Which meaning fits the sentence?</p>
      <div class="choices">${defs.map(d=>`<button class="choice ${it.defDone&&d.ok?"right":""}" data-def="${d.ok?1:0}">${d.t}</button>`).join("")}</div>
      <div class="feedback" id="fb2">${it.defDone?"✅ Got it!":""}</div>
    </div>

    <div class="step ${it.defDone?"":"lockedstep"}" id="st3">
      <h3>Step 3 · Picture</h3>
      <p class="hint">Which picture best shows what "${w.word}" means?</p>
      <div class="choices pics">${pics.map(p=>`<button class="choice pic ${it.picDone&&p.ok?"right":""}" data-pic="${p.ok?1:0}" aria-label="${p.l}">${p.e}<span>${p.l}</span></button>`).join("")}</div>
      <div class="feedback" id="fb3">${it.picDone?"✅ Perfect picture!":""}</div>
    </div>

    <div class="step ${it.picDone?"":"lockedstep"}" id="st4">
      <h3>Step 4 · Write Your Own Sentence ✍️</h3>
      <p class="hint">Use "${w.word}" in a sentence that is <b>different from the example</b>. Type it yourself. Copy and paste is turned off.</p>
      ${it.sentDone?"":`<div class="starters"><span style="font-weight:800;font-size:15px;color:var(--muted)">Stuck? Tap a starter:</span>${w.starters.map(s=>`<button class="starter" data-start="${esc(s)}">${esc(s)}…</button>`).join("")}</div>`}
      <textarea id="sent" ${it.sentDone?"readonly":""} autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="true" placeholder="Type your sentence here...">${esc(it.sentence)}</textarea>
      <div class="warn" id="pasteWarn">🚫 Pasting is turned off. Your sentence has to be typed by you.</div>
      <div class="nudge" id="nudge"></div>
      <ul class="checks" id="checks"></ul>
      <div class="row">${it.sentDone?`<div class="earned" style="flex:1">🔑 Key earned for "${w.word}"!</div>`:`<button class="btn gold" id="lockBtn" disabled>🔒 Lock it in</button><button class="speak" id="sayMine">🔊 Read my sentence</button>`}</div>
    </div>
  </div>
  <div class="row noprint" style="justify-content:space-between">
    <button class="btn ghost" id="prevBtn" ${i===0?"disabled":""}>⬅ Back</button>
    <button class="btn" id="nextBtn">${nextLabel(i)}</button>
  </div>`;
  $("#app").innerHTML=h;
  wireRing();
  $("#sayCtx").onclick=()=>say(w.example);
  $("#sayDefs").onclick=()=>say(defs.map((d,k)=>"Choice "+(k+1)+". "+d.t).join(". "));
  $("#prevBtn").onclick=()=>{S.current=i-1;save();render();scrollTo(0,0);};
  $("#nextBtn").onclick=()=>goNext(i);

  // Step 1
  document.querySelectorAll("[data-pos]").forEach(b=>b.onclick=()=>{
    if(it.posDone) return;
    it.posTries++;
    if(b.dataset.pos===w.pos){ it.posDone=true; save(); renderWord(i); }
    else { b.classList.add("wrong"); $("#fb1").className="feedback no"; $("#fb1").textContent="Not quite. Hint: "+w.posHint; save(); }
  });
  // Step 2
  document.querySelectorAll("[data-def]").forEach(b=>b.onclick=()=>{
    if(it.defDone) return;
    it.defTries++;
    if(b.dataset.def==="1"){ it.defDone=true; save(); renderWord(i); }
    else { b.classList.add("wrong"); $("#fb2").className="feedback no"; $("#fb2").textContent="Try again. Reread the sentence and plug the meaning in where the word is."; save(); }
  });
  // Step 3
  document.querySelectorAll("[data-pic]").forEach(b=>b.onclick=()=>{
    if(it.picDone) return;
    it.picTries++;
    if(b.dataset.pic==="1"){ it.picDone=true; save(); renderWord(i); }
    else { b.classList.add("wrong"); $("#fb3").className="feedback no"; $("#fb3").textContent="Hmm, does that picture match the meaning? Try another."; save(); }
  });
  // Step 4
  const ta=$("#sent");
  const update=()=>{
    const r=checkSentence(ta.value,w);
    $("#checks").innerHTML=r.checks.map(c=>`<li class="${c.pass?"pass":""}"><span class="ic">${c.pass?"✓":""}</span>${c.label}</li>`).join("");
    const n=$("#nudge"); n.textContent=r.nudge; n.classList.toggle("show",!!r.nudge && ta.value.trim().length>3 && !it.sentDone);
    if($("#lockBtn")) $("#lockBtn").disabled=!r.ok;
    return r;
  };
  update();
  if(!it.sentDone){
    let last=ta.value, t0=null;
    const block=(e)=>{ e.preventDefault(); S.pasteBlocks++; save(); const pw=$("#pasteWarn"); pw.classList.add("show"); setTimeout(()=>pw.classList.remove("show"),3500); };
    ta.addEventListener("paste",block); ta.addEventListener("drop",block);
    ta.addEventListener("beforeinput",e=>{ if(/insertFromPaste|insertFromDrop|insertFromYank/.test(e.inputType||"")) block(e); });
    ta.addEventListener("keydown",()=>{ if(!t0) t0=Date.now(); it.keys++; });
    ta.addEventListener("input",()=>{
      // catch big chunks of text dropped in at once (paste workarounds, dictation)
      if(ta.value.length - last.length > 20){ ta.value=last; S.bigInserts++; block({preventDefault(){}}); }
      last=ta.value; it.sentence=ta.value;
      if(t0){ it.typeMs += Date.now()-t0; t0=Date.now(); }
      save(); update();
    });
    document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{
      if(ta.value.trim().length>0 && !confirm("Replace what you typed with this starter?")) return;
      ta.value=b.dataset.start+" "; last=ta.value; it.sentence=ta.value; save(); update(); ta.focus();
      ta.setSelectionRange(ta.value.length,ta.value.length);
    });
    $("#sayMine").onclick=()=>say(ta.value||"You haven't typed anything yet.");
    $("#lockBtn").onclick=()=>{
      const r=update(); if(!r.ok) return;
      it.sentence=ta.value.trim(); it.sentDone=true; save();
      const dc=doneCount(), todayDone=[0,1,2].every(wordDone);
      if(dc===6 || (todayDone && i<3 && !S.sawToday)){
        if(dc<6) S.sawToday=true;
        burst(dc===6?320:160);
        say(dc===6?"Amazing! You unlocked all six words! Here is your work.":"Great job! You finished today's words. Here is your work.");
        S.current="turnin"; save();
        setTimeout(()=>{ render(); scrollTo(0,0); }, 1200);
        renderWord(i); return;
      }
      burst(50);
      renderWord(i);
    };
  }
}
function nextLabel(i){
  if(i===2 && !unlocked(3)) return "📄 My Work ➜";
  if(i===5) return "📄 My Work ➜";
  return "Next word ➜";
}
function goNext(i){
  if(i===5 || (i===2 && !unlocked(3))) S.current="turnin"; else S.current=i+1;
  save(); render(); scrollTo(0,0);
}
function wireRing(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const g=b.dataset.go;
    if(g==="turnin"){ S.current="turnin"; }
    else { const k=+g; if(!unlocked(k)){ alert("🔒 Finish words 1–3 first to unlock this one!"); return; } S.current=k; }
    save(); render(); scrollTo(0,0);
  });
}

/* ===================== SCORING + TURN-IN ===================== */
function itemScore(it){ // 5 points per word
  let p=0;
  if(it.posDone && it.posTries===1) p++;
  if(it.defDone && it.defTries===1) p++;
  if(it.picDone && it.picTries===1) p++;
  if(it.sentDone) p+=2;
  return p;
}
function tryMark(n){ return n===1?"✓":`${n} tries`; }
function renderTurnIn(){
  const total=S.items.reduce((a,it)=>a+itemScore(it),0);
  const mins=Math.max(1,Math.round(S.items.reduce((a,it)=>a+it.typeMs,0)/60000));
  const stamp=new Date().toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  let wm=""; for(let r=0;r<9;r++) wm+=`<div style="top:${r*130-40}px;left:${(r%2)*-120-60}px">${esc(fullName())} · ${esc(fullName())} · ${esc(fullName())} · ${esc(fullName())}</div>`;
  let rows=WORDS.map((w,i)=>{
    const it=S.items[i];
    const def=w.defs.find(d=>d.ok).t;
    const pic=w.pics.find(p=>p.ok).e;
    return `<tr>
      <td>${w.n}</td>
      <td>${w.context}</td>
      <td>${it.posDone?w.pos:"—"}</td>
      <td>${it.defDone?def:"—"}</td>
      <td>${it.sentDone?esc(it.sentence):"<i>not finished</i>"}</td>
      <td class="pic">${it.picDone?pic:"—"}</td>
      <td><b>${itemScore(it)}/5</b>${wordDone(i)?`<div class="tries">POS ${tryMark(it.posTries)}<br>Def ${tryMark(it.defTries)}<br>Pic ${tryMark(it.picTries)}<br>Sent ✓</div>`:""}</td></tr>`;
  }).join("");
  const todayPts=[0,1,2].reduce((a,k)=>a+itemScore(S.items[k]),0);
  const pct=Math.round(total/30*100), todayPct=Math.round(todayPts/15*100);
  $("#app").innerHTML = ringHTML() + `
  <div class="card" id="turnin">
    <div class="watermark">${wm}</div>
    <div class="workbanner"><img src="${document.querySelector('header.top img').src}" alt=""><div><div class="wbtitle">🔑 My Work</div><div style="font-weight:700">Show this page to get your grade.</div></div></div>
    <div class="gradebox">
      <div class="g"><div class="gl">Words 1–3 (today)</div><div class="gn">${todayPts}/15</div><div class="gp">${todayPct}%</div></div>
      <div class="g main"><div class="gl">All 6 words</div><div class="gn">${total}/30</div><div class="gp">${pct}%</div></div>
      <div class="g"><div class="gl">Keys earned</div><div class="gn">${doneCount()}/6</div><div class="gp">${doneCount()===6?"Complete! 🎉":"In progress"}</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:flex-start">
      <div>
        <div style="font-family:Fredoka;font-size:22px;color:var(--navy)">Name: ${esc(fullName())}</div>
        <div style="font-weight:800">Vocabulary Unit 2 Story 2: How Smart Are Animals</div>
        <div class="stats">
          <span class="pill">Saved ${stamp}</span>
          <span class="pill">Words finished: ${doneCount()}/6</span>
          <span class="pill">Typing time: ~${mins} min</span>
          <span class="pill" style="${S.pasteBlocks?"background:var(--bad-bg);color:var(--bad)":""}">Paste attempts blocked: ${S.pasteBlocks}</span>
        </div>
      </div>
    </div>
    <table class="ti">
      <thead><tr><th>#</th><th>Word in Context</th><th>POS</th><th>Denotation</th><th>My Sentence</th><th>Picture</th><th>Pts</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p style="font-size:13px;color:var(--muted);margin-bottom:0">Points: 1 each for part of speech, definition, and picture on the first try, plus 2 for a sentence that passes every check (capital letter, end punctuation, uses the word, 8+ words, own sentence).</p>
  </div>
  <div class="card noprint">
    <h3 style="font-family:Fredoka;color:var(--navy);margin-top:0">📤 How to turn this in on Canvas</h3>
    <ul class="howto">
      <li>1️⃣ Tap <b>Save as PDF</b> below. Then tap the Share button ⬆️ and pick <b>Save to Files</b>.</li>
      <li>2️⃣ In Canvas, open <b>How Smart Are Animals Vocabulary</b> and tap <b>Start Assignment</b>, then <b>Upload File</b>.</li>
      <li>📸 If that doesn't work, take a screenshot of this page and upload the screenshot.</li>
    </ul>
    <div class="row"><button class="btn gold" id="printBtn">📄 Save as PDF</button>
    ${doneCount()<6?`<span style="font-weight:800;color:var(--muted)">Words 4–6 are due Friday, 11/7. Turn in again when all 6 keys are earned.</span>`:""}</div>
    ${doneCount()<6?`<div class="row"><button class="btn" id="keepGoing">Keep going ➜ Word ${S.items.findIndex((_,k)=>!wordDone(k))+1}</button></div>`:""}
  </div>`;
  wireRing();
  $("#printBtn").onclick=()=>window.print();
  if($("#keepGoing")) $("#keepGoing").onclick=()=>{ const k=S.items.findIndex((_,j)=>!wordDone(j)); S.current=unlocked(k)?k:0; save(); render(); scrollTo(0,0); };
  if(doneCount()===6) setTimeout(()=>burst(260),250);
}

/* ===================== TEACHER RESET ===================== */
$("#teacherReset").onclick=()=>{
  const p=prompt("Teacher PIN to erase this iPad's work:");
  if(p===TEACHER_PIN){ S=blank(); try{localStorage.removeItem(STORE);}catch(e){} render(); }
  else if(p!==null) alert("That PIN is not right.");
};

/* ===================== CONFETTI ===================== */
const cv=$("#confetti"), cx=cv.getContext("2d"); let parts=[], anim=null;
function sizeCv(){ cv.width=innerWidth; cv.height=innerHeight; } sizeCv(); addEventListener("resize",sizeCv);
function burst(n){
  const cols=["#e3a91c","#138a8a","#7a3f98","#e0526e","#3f8a3f","#16365c"];
  for(let k=0;k<n;k++) parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,s:Math.random()*8+5,c:cols[k%6],r:Math.random()*6,vr:(Math.random()-.5)*.3,life:0});
  if(!anim) tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<400);
  anim = parts.length? requestAnimationFrame(tick) : (cx.clearRect(0,0,cv.width,cv.height), null);
}

render();
</script>
